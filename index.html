<!doctype html>
<html lang="en" class="theme-pending">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ro Sync</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="root" class="app" data-view="projects">
      <header id="desktop-titlebar" class="desktop-titlebar" aria-label="Ro Sync window title" data-tauri-drag-region>
        <div class="desktop-titlebar-brand" data-tauri-drag-region>
          <img src="assets/rosynclogo.png" alt="Ro Sync" data-tauri-drag-region />
        </div>
        <span class="desktop-titlebar-context" data-tauri-drag-region>Studio bridge</span>
        <button id="desktop-update" class="desktop-update" type="button" hidden>
          <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 1.75v8.5M4.75 7.25 8 10.5l3.25-3.25"/>
            <path d="M2.25 12.5v1.25h11.5V12.5"/>
          </svg>
          <span>Update</span>
        </button>
      </header>
      <aside class="sidebar">
        <div class="sidebar-brand">
          <span id="daemon-dot" class="dot dot-idle" title="Daemon status"></span>
          <img class="brand-logo" src="assets/rosynclogo.png" alt="Ro Sync" />
        </div>
        <nav class="sidenav tabs" role="tablist">
          <button id="nav-projects" class="tab sidenav-item" role="tab" data-route="projects" aria-label="Projects" aria-controls="view" tabindex="0">
            <svg class="sidenav-icon" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true">
              <path d="M1.75 4.25a1 1 0 0 1 1-1h3.5l1.5 1.5h6.5a1 1 0 0 1 1 1v6.5a1 1 0 0 1-1 1H2.75a1 1 0 0 1-1-1v-7z"/>
            </svg>
            <span class="sidenav-label">Projects</span>
            <span id="projects-serving-indicator" class="projects-serving-indicator" aria-hidden="true"></span>
          </button>
          <button id="nav-active" class="tab sidenav-item" role="tab" data-route="active" aria-label="Activity" aria-controls="view" tabindex="-1">
            <svg class="sidenav-icon" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1.5 8.5h3l1.5-4 3 8 1.5-4h4"/>
            </svg>
            <span class="sidenav-label">Activity</span>
          </button>
          <button id="nav-conflicts" class="tab sidenav-item" role="tab" data-route="conflicts" aria-label="Conflicts" aria-controls="view" tabindex="-1">
            <svg class="sidenav-icon" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 1.75 1.5 13.25h13L8 1.75z"/>
              <path d="M8 6.5v3M8 11v.6" stroke-linecap="round"/>
            </svg>
            <span class="sidenav-label">Conflicts</span>
            <span id="conflicts-badge" class="badge badge-ok sidenav-badge" title="No conflicts">0</span>
          </button>
        </nav>
        <div class="sidebar-foot">
          <div class="helpcard">
            <span class="helpcard-icon" aria-hidden="true">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="8" cy="8" r="6.25"/>
                <path d="M6.25 6.25c.3-1 1-1.5 1.85-1.5 1 0 1.9.7 1.9 1.7 0 1-.95 1.3-1.5 1.7-.42.3-.5.7-.5 1.05"/>
                <path d="M8 11.4v.4" stroke-linecap="round"/>
              </svg>
            </span>
            <div class="helpcard-text">
              <strong class="helpcard-title">Need help?</strong>
              <p class="helpcard-body">Open Docs or an issue on GitHub.</p>
            </div>
          </div>
          <nav class="sidenav sidenav-secondary tabs" role="tablist" aria-label="Help and settings">
            <button id="nav-docs" class="tab sidenav-item" role="tab" data-route="docs" aria-label="Docs" aria-controls="view" tabindex="-1">
              <svg class="sidenav-icon" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4.25 2.25h5.5l2 2v9.5h-7.5a1 1 0 0 1-1-1V3.25a1 1 0 0 1 1-1z"/>
                <path d="M9.75 2.25v2h2"/>
                <path d="M5.75 7.25h4.5M5.75 9.5h4.5M5.75 11.75h2.5"/>
              </svg>
              <span class="sidenav-label">Docs</span>
            </button>
            <button id="nav-settings" class="tab sidenav-item" role="tab" data-route="settings" aria-label="Settings" aria-controls="view" tabindex="-1">
              <svg class="sidenav-icon" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="8" cy="8" r="2.2"/>
                <path d="M8 1.25v1.8M8 12.95v1.8M14.75 8h-1.8M3.05 8h-1.8M12.78 3.22l-1.27 1.27M4.49 11.51l-1.27 1.27M12.78 12.78l-1.27-1.27M4.49 4.49 3.22 3.22"/>
              </svg>
              <span class="sidenav-label">Settings</span>
            </button>
          </nav>
        </div>
      </aside>
      <main id="view" class="view" role="tabpanel" aria-labelledby="nav-projects" aria-live="polite" tabindex="0"></main>
      <footer class="statusbar">
        <span id="status-left" class="status-left">—</span>
        <span id="status-right" class="status-right">—</span>
      </footer>
    </div>

    <div id="projects-root-prompt" class="modal-overlay projects-root-prompt" hidden>
      <section class="modal-card projects-root-card" role="dialog" aria-modal="true" aria-labelledby="projects-root-title" aria-describedby="projects-root-description">
        <div class="projects-root-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
            <path d="M2.75 6.75a1.5 1.5 0 0 1 1.5-1.5h5l2 2h8.5a1.5 1.5 0 0 1 1.5 1.5v8.5a1.5 1.5 0 0 1-1.5 1.5H4.25a1.5 1.5 0 0 1-1.5-1.5V6.75z"/>
          </svg>
        </div>
        <div class="projects-root-copy">
          <h2 id="projects-root-title" class="modal-title">Choose your Projects folder</h2>
          <p id="projects-root-description" class="modal-sub">Ro Sync uses this folder for projects created from Roblox Studio. You can change it later in Settings.</p>
        </div>
        <p id="projects-root-error" class="modal-err" role="alert" hidden></p>
        <button id="projects-root-choose" class="primary projects-root-choose" type="button">Choose Projects Folder</button>
        <button id="projects-root-skip" class="projects-root-skip" type="button">Skip for now</button>
      </section>
    </div>

    <div id="desktop-update-confirm" class="modal-overlay desktop-update-confirm" hidden>
      <section class="modal-card desktop-update-confirm-card" role="dialog" aria-modal="true" aria-labelledby="desktop-update-confirm-title" aria-describedby="desktop-update-confirm-description">
        <div class="desktop-update-warning-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3 2.75 20h18.5L12 3z"/>
            <path d="M12 8.5v5.25M12 17.25v.25"/>
          </svg>
        </div>
        <div class="desktop-update-confirm-copy">
          <h2 id="desktop-update-confirm-title" class="modal-title">Update Ro Sync?</h2>
          <p id="desktop-update-confirm-description" class="modal-sub"></p>
        </div>
        <div class="desktop-update-confirm-actions">
          <button id="desktop-update-cancel" type="button">Not now</button>
          <button id="desktop-update-proceed" class="primary" type="button">Update &amp; Restart</button>
        </div>
      </section>
    </div>

    <script type="module" src="bridge.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
