[package]
name = "ro-sync-desktop"
version = "0.2.0"
description = "A secure native desktop host for Ro Sync"
authors = ["Ro Sync contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ro_sync_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["native-keyring"]
native-keyring = ["dep:keyring"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.3"
keyring = { version = "3.6", optional = true, default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3"
