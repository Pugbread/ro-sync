version: 2
updates:
  - package-ecosystem: cargo
    directory: /daemon
    schedule:
      interval: weekly
    labels: ["dependencies", "rust"]
    groups:
      rust-runtime:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule:
      interval: weekly
    labels: ["dependencies", "desktop"]
    groups:
      tauri-runtime:
        patterns: ["tauri*", "serde*", "tokio*"]

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    labels: ["dependencies", "desktop"]
    groups:
      tauri-tooling:
        patterns: ["@tauri-apps/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "ci"]
