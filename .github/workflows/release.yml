name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  updater-smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop signing tools
        working-directory: desktop
        run: npm ci
      - name: Test updater trust and manifest pipeline with an ephemeral key
        run: node scripts/smoke-updater-release.mjs

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            out: rosync-darwin-arm64
            src_bin: rosync
            tool_target: darwin-arm64
            compiler_bin: luau-compile
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            out: rosync-linux-x86_64
            src_bin: rosync
            tool_target: linux-x86_64
            compiler_bin: luau-compile
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            out: rosync-windows-x86_64.exe
            src_bin: rosync.exe
            tool_target: windows-x86_64
            compiler_bin: luau-compile.exe

    runs-on: ${{ matrix.os }}
    env:
      ROSYNC_TAGGED_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
      ROSYNC_BUILD_COMMIT: ${{ github.sha }}
      ROSYNC_BUILD_DIRTY: "false"
    steps:
      - uses: actions/checkout@v7

      - name: Check widget platform commands
        run: node scripts/check-platform-commands.mjs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon -> target

      - name: Test
        working-directory: daemon
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: Build
        working-directory: daemon
        run: cargo build --profile dist --locked --target ${{ matrix.target }}

      - name: Import Windows Authenticode certificate
        if: runner.os == 'Windows' && env.ROSYNC_TAGGED_RELEASE == '1'
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          $required = @(
            'WINDOWS_CODESIGN_PFX_BASE64',
            'WINDOWS_CODESIGN_PFX_PASSWORD'
          )
          $missing = @($required | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          })
          if ($missing.Count -gt 0) {
            throw "tagged Windows releases require repository secrets: $($missing -join ', ')"
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'ro-sync-authenticode.pfx'
          try {
            [IO.File]::WriteAllBytes(
              $pfxPath,
              [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64)
            )
            $password = ConvertTo-SecureString `
              -String $env:WINDOWS_CODESIGN_PFX_PASSWORD `
              -AsPlainText `
              -Force
            $imported = @(Import-PfxCertificate `
              -FilePath $pfxPath `
              -CertStoreLocation 'Cert:\CurrentUser\My' `
              -Password $password)
            $certificate = $imported |
              Where-Object { $_.HasPrivateKey } |
              Select-Object -First 1
            if (-not $certificate) {
              throw 'WINDOWS_CODESIGN_PFX_BASE64 did not contain a certificate with a private key'
            }
          }
          finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

          $thumbprint = $certificate.Thumbprint.Replace(' ', '').ToUpperInvariant()
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "WINDOWS_CODESIGN_THUMBPRINT=$thumbprint"

          $signTool = Get-Command signtool.exe -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Source -First 1
          if (-not $signTool) {
            $kitsRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
            $signTool = Get-ChildItem -Path $kitsRoot -Filter signtool.exe -File -Recurse |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -ExpandProperty FullName -First 1
          }
          if (-not $signTool) { throw 'signtool.exe was not found on the Windows runner' }

          Add-Content -LiteralPath $env:GITHUB_ENV -Value "WINDOWS_SIGNTOOL=$signTool"

      - name: Sign and verify standalone Windows daemon
        if: runner.os == 'Windows' && env.ROSYNC_TAGGED_RELEASE == '1'
        shell: pwsh
        run: |
          $binary = "daemon/target/${{ matrix.target }}/dist/${{ matrix.src_bin }}"
          & $env:WINDOWS_SIGNTOOL sign `
            /s My `
            /sha1 $env:WINDOWS_CODESIGN_THUMBPRINT `
            /fd SHA256 `
            /tr 'http://timestamp.digicert.com' `
            /td SHA256 `
            $binary
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed for $binary" }

          & $env:WINDOWS_SIGNTOOL verify /pa /all /tw $binary
          if ($LASTEXITCODE -ne 0) { throw "signtool verify failed for $binary" }

      - name: Verify standalone daemon build identity
        shell: bash
        run: |
          set -euo pipefail
          daemon_version="$(node -e '
            const fs = require("node:fs");
            const version = fs.readFileSync("daemon/Cargo.toml", "utf8")
              .match(/^\s*version\s*=\s*"([^"]+)"/m)?.[1];
            if (!version) throw new Error("daemon Cargo version is missing");
            process.stdout.write(version);
          ')"
          if [[ "$ROSYNC_TAGGED_RELEASE" == "1" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            test "$tag_version" = "$daemon_version" || {
              echo "tag version $tag_version does not match daemon $daemon_version" >&2
              exit 1
            }
          fi
          node scripts/verify-build-identity.mjs \
            --daemon "daemon/target/${{ matrix.target }}/dist/${{ matrix.src_bin }}" \
            --commit "$GITHUB_SHA" \
            --version "$daemon_version"

      - name: Install checksum-pinned Luau compiler
        run: node scripts/install-luau-compiler.mjs --target ${{ matrix.tool_target }}

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          dist="daemon/dist"
          bundle="$dist/bundle-root"
          archive="$dist/rosync-${{ matrix.tool_target }}-bundle.zip"
          rm -rf "$bundle"
          mkdir -p \
            "$bundle/daemon" \
            "$bundle/tools/luau/${{ matrix.tool_target }}"
          cp \
            "daemon/target/${{ matrix.target }}/dist/${{ matrix.src_bin }}" \
            "$dist/${{ matrix.out }}"
          cp "$dist/${{ matrix.out }}" "$bundle/daemon/${{ matrix.out }}"
          cp \
            "tools/luau/${{ matrix.tool_target }}/${{ matrix.compiler_bin }}" \
            "$bundle/tools/luau/${{ matrix.tool_target }}/"
          cp tools/luau/README.md tools/luau/LICENSE.txt "$bundle/tools/luau/"

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # PowerShell Compress-Archive writes backslash entry names, which
            # violates the zip spec and fails the release bundle verification;
            # Windows' bundled bsdtar produces standard forward-slash entries.
            archive_win="$(cygpath -w "$PWD/$archive")"
            bundle_win="$(cygpath -w "$bundle")"
            /c/Windows/System32/tar.exe -a -cf "$archive_win" -C "$bundle_win" daemon tools
          else
            archive_abs="$PWD/$archive"
            (cd "$bundle" && zip -q -r "$archive_abs" .)
          fi

          RAW_PATH="$dist/${{ matrix.out }}" ARCHIVE_PATH="$archive" node -e '
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            const path = require("node:path");
            for (const file of [process.env.RAW_PATH, process.env.ARCHIVE_PATH]) {
              const hash = crypto.createHash("sha256")
                .update(fs.readFileSync(file))
                .digest("hex");
              fs.writeFileSync(file + ".sha256", hash + "  " + path.basename(file) + "\n");
            }
          '
          (
            cd "$dist"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum --check --strict -- \
                "${{ matrix.out }}.sha256" \
                "rosync-${{ matrix.tool_target }}-bundle.zip.sha256"
            else
              shasum -a 256 --check \
                "${{ matrix.out }}.sha256" \
                "rosync-${{ matrix.tool_target }}-bundle.zip.sha256"
            fi
          )
          rm -rf "$bundle"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: |
            daemon/dist/${{ matrix.out }}
            daemon/dist/${{ matrix.out }}.sha256
            daemon/dist/rosync-${{ matrix.tool_target }}-bundle.zip
            daemon/dist/rosync-${{ matrix.tool_target }}-bundle.zip.sha256

      - name: Remove imported Windows Authenticode certificate
        if: always() && runner.os == 'Windows' && env.ROSYNC_TAGGED_RELEASE == '1'
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_THUMBPRINT)) {
            $certificatePath = "Cert:\CurrentUser\My\$($env:WINDOWS_CODESIGN_THUMBPRINT)"
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }

  plugin:
    runs-on: ubuntu-22.04
    env:
      ROSYNC_BUILD_COMMIT: ${{ github.sha }}
      ROSYNC_BUILD_DIRTY: "false"
    steps:
      - uses: actions/checkout@v7
      - name: Check cross-runtime protocol constants
        run: node scripts/check-plugin-reconnect-policy.mjs
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned Luau compiler
        run: |
          set -euo pipefail
          compiler="$RUNNER_TEMP/luau-compile"
          node scripts/install-luau-compiler.mjs \
            --target linux-x86_64 \
            --dest "$compiler"
          test -x "$compiler"
          echo "LUAU_COMPILE=$compiler" >> "$GITHUB_ENV"
      - name: Compile Studio plugin Luau bytecode
        run: |
          node scripts/check-luau-bytecode.mjs plugin/Plugin.luau
          node scripts/check-luau-bytecode.mjs plugin/Clipboard.luau
          node scripts/check-luau-bytecode.mjs plugin/PathHelpers.luau
          node scripts/check-luau-bytecode.mjs plugin/Reflection.luau
          node scripts/check-luau-bytecode.mjs plugin/RemoteCodec.luau
          node scripts/check-luau-bytecode.mjs plugin/Playscript.luau
          node scripts/check-luau-bytecode.mjs plugin/Photo.luau
          node scripts/check-luau-bytecode.mjs plugin-src/src/App.luau
          node scripts/check-luau-bytecode.mjs plugin-src/src/BuildInfo.luau
      - name: Install plugin build tools
        run: |
          cargo install --locked --version 0.3.2 wally
          cargo install --locked --version 7.5.1 rojo
      - name: Build Studio plugin
        run: node plugin/build-plugin.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: RoSyncPlugin.rbxm
          path: |
            plugin/Plugin.rbxm
            plugin/Plugin.build.json

  desktop:
    needs: [build, plugin, updater-smoke]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            platform: darwin-arm64
            sidecar_artifact: rosync-darwin-arm64
            sidecar: rosync-darwin-arm64
            asset_platform: macos-arm64
            lsp_asset: luau-lsp-macos.zip
            lsp_binary: luau-lsp
            lsp_sha256: e32a71823ee47471d931a03e4186ced2b4c43bb785c8fe05de901fe54c6ebe21
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            sidecar_artifact: rosync-windows-x86_64.exe
            sidecar: rosync-windows-x86_64.exe
            asset_platform: windows-x64
            lsp_asset: luau-lsp-win64.zip
            lsp_binary: luau-lsp.exe
            lsp_sha256: 15f2add7c70191c5cd636b047968760f0056893b63be10294453c75430bcb339

    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      LUAU_LSP_VERSION: "1.68.1"
      LUAU_LSP_LICENSE_SHA256: 5bf374ce7ab54c8d75f14e21f04932cae10708189afaec95321aed1a47701935
      ROSYNC_TAGGED_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
      ROSYNC_BUILD_COMMIT: ${{ github.sha }}
      ROSYNC_BUILD_DIRTY: "false"
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache desktop cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Download same-commit daemon sidecar
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.sidecar_artifact }}
          path: .release-input/daemon

      - name: Download same-commit Studio plugin
        uses: actions/download-artifact@v4
        with:
          name: RoSyncPlugin.rbxm
          path: .release-input/plugin

      - name: Stage same-commit native inputs
        shell: bash
        run: |
          set -euo pipefail
          sidecar="$(find .release-input/daemon -type f -name '${{ matrix.sidecar }}' -print -quit)"
          sidecar_checksum="$(find .release-input/daemon -type f -name '${{ matrix.sidecar }}.sha256' -print -quit)"
          studio_plugin="$(find .release-input/plugin -type f -name Plugin.rbxm -print -quit)"
          plugin_manifest="$(find .release-input/plugin -type f -name Plugin.build.json -print -quit)"
          test -n "$sidecar"
          test -n "$sidecar_checksum"
          test -n "$studio_plugin"
          test -n "$plugin_manifest"
          (
            cd "$(dirname "$sidecar_checksum")"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum --check --strict -- "$(basename "$sidecar_checksum")"
            else
              shasum -a 256 --check "$(basename "$sidecar_checksum")"
            fi
          )
          cp "$sidecar" "daemon/${{ matrix.sidecar }}"
          cp "$studio_plugin" plugin/Plugin.rbxm
          cp "$plugin_manifest" plugin/Plugin.build.json
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            chmod +x "daemon/${{ matrix.sidecar }}"
          fi

      - name: Install checksum-pinned Luau compiler
        run: node scripts/install-luau-compiler.mjs --target ${{ matrix.platform }}

      - name: Install checksum-pinned luau-lsp
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/${{ matrix.lsp_asset }}"
          extract_dir="$RUNNER_TEMP/luau-lsp"
          destination="tools/luau-lsp/${{ matrix.platform }}/${{ matrix.lsp_binary }}"
          license="tools/luau-lsp/LICENSE.md"
          curl --fail --location --retry 3 \
            "https://github.com/JohnnyMorganz/luau-lsp/releases/download/$LUAU_LSP_VERSION/${{ matrix.lsp_asset }}" \
            --output "$archive"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/$LUAU_LSP_VERSION/LICENSE.md" \
            --output "$license"
          LSP_ARCHIVE="$archive" LSP_SHA256="${{ matrix.lsp_sha256 }}" \
            LSP_LICENSE="$license" node -e '
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            function verify(file, expected, label) {
              const actual = crypto.createHash("sha256")
                .update(fs.readFileSync(file)).digest("hex");
              if (actual !== expected) throw new Error(`${label} SHA-256 mismatch: ${actual}`);
            }
            verify(process.env.LSP_ARCHIVE, process.env.LSP_SHA256, "luau-lsp archive");
            verify(process.env.LSP_LICENSE, process.env.LUAU_LSP_LICENSE_SHA256, "luau-lsp license");
          '
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir" "$(dirname "$destination")"
          unzip -q "$archive" -d "$extract_dir"
          executable="$(find "$extract_dir" -type f -name '${{ matrix.lsp_binary }}' -print -quit)"
          test -n "$executable"
          cp "$executable" "$destination"
          if [[ "$RUNNER_OS" != "Windows" ]]; then chmod +x "$destination"; fi
          "$destination" --version | grep -F "$LUAU_LSP_VERSION"

      - name: Keep only target runtime tools
        shell: bash
        run: |
          set -euo pipefail
          for platform in darwin-arm64 darwin-x86_64 linux-x86_64 windows-x86_64; do
            if [[ "$platform" != "${{ matrix.platform }}" ]]; then
              rm -rf "tools/luau/$platform" "tools/luau-lsp/$platform"
            fi
          done

      - name: Verify generated command documentation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-command-docs.mjs
          git diff --exit-code -- docs/client-commands.generated.json docs/client-commands.md

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Resolve desktop release version
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const config = require("./desktop/src-tauri/tauri.conf.json");
            const desktopPackage = require("./desktop/package.json");
            const daemonCargo = fs.readFileSync("./daemon/Cargo.toml", "utf8")
              .match(/^\s*version\s*=\s*"([^"]+)"/m)?.[1];
            const desktopCargo = fs.readFileSync("./desktop/src-tauri/Cargo.toml", "utf8")
              .match(/^\s*version\s*=\s*"([^"]+)"/m)?.[1];
            const tagged = process.env.ROSYNC_TAGGED_RELEASE === "1";
            const version = tagged ? process.env.GITHUB_REF_NAME.replace(/^v/, "") : config.version;
            const semver = /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/;
            if (!semver.test(version)) throw new Error(`invalid desktop release version: ${version}`);
            for (const [label, embedded] of [
              ["Tauri config", config.version],
              ["desktop package", desktopPackage.version],
              ["desktop Cargo package", desktopCargo],
              ["daemon Cargo package", daemonCargo],
            ]) {
              if (embedded !== version) {
                throw new Error(`${label} version ${embedded} does not match release ${version}`);
              }
            }
            fs.appendFileSync(process.env.GITHUB_ENV, `ROSYNC_DESKTOP_VERSION=${version}\n`);
          '

      - name: Prepare desktop native-host resources
        working-directory: desktop
        run: npm run sync

      - name: Test desktop native host
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Import Windows Authenticode certificate
        if: runner.os == 'Windows' && env.ROSYNC_TAGGED_RELEASE == '1'
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          $required = @(
            'WINDOWS_CODESIGN_PFX_BASE64',
            'WINDOWS_CODESIGN_PFX_PASSWORD'
          )
          $missing = @($required | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          })
          if ($missing.Count -gt 0) {
            throw "tagged Windows releases require repository secrets: $($missing -join ', ')"
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'ro-sync-authenticode.pfx'
          try {
            [IO.File]::WriteAllBytes(
              $pfxPath,
              [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64)
            )
            $password = ConvertTo-SecureString `
              -String $env:WINDOWS_CODESIGN_PFX_PASSWORD `
              -AsPlainText `
              -Force
            $imported = @(Import-PfxCertificate `
              -FilePath $pfxPath `
              -CertStoreLocation 'Cert:\CurrentUser\My' `
              -Password $password)
            $certificate = $imported |
              Where-Object { $_.HasPrivateKey } |
              Select-Object -First 1
            if (-not $certificate) {
              throw 'WINDOWS_CODESIGN_PFX_BASE64 did not contain a certificate with a private key'
            }
          }
          finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

          $thumbprint = $certificate.Thumbprint.Replace(' ', '').ToUpperInvariant()
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "WINDOWS_CODESIGN_THUMBPRINT=$thumbprint"

          $signTool = Get-Command signtool.exe -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Source -First 1
          if (-not $signTool) {
            $kitsRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
            $signTool = Get-ChildItem -Path $kitsRoot -Filter signtool.exe -File -Recurse |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -ExpandProperty FullName -First 1
          }
          if (-not $signTool) { throw 'signtool.exe was not found on the Windows runner' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "WINDOWS_SIGNTOOL=$signTool"

      - name: Build desktop installers and signed updater artifacts
        working-directory: desktop
        shell: bash
        env:
          ROSYNC_UPDATER_PUBLIC_KEY: ${{ vars.ROSYNC_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: http://timestamp.digicert.com
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/ro-sync-release-config.json"
          if [[ "$ROSYNC_TAGGED_RELEASE" == "1" ]]; then
            test -n "$ROSYNC_UPDATER_PUBLIC_KEY" || {
              echo "ROSYNC_UPDATER_PUBLIC_KEY repository variable is required for tagged releases" >&2
              exit 1
            }
            test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
              echo "TAURI_SIGNING_PRIVATE_KEY repository secret is required for tagged releases" >&2
              exit 1
            }
            node ../scripts/check-updater-key-pin.mjs verify
            node -e '
              const fs = require("node:fs");
              const config = {
                version: process.env.ROSYNC_DESKTOP_VERSION,
                bundle: { createUpdaterArtifacts: true },
                plugins: { updater: { pubkey: process.env.ROSYNC_UPDATER_PUBLIC_KEY } },
              };
              if (process.platform === "win32") {
                if (!process.env.WINDOWS_CODESIGN_THUMBPRINT) {
                  throw new Error("tagged Windows release is missing imported certificate thumbprint");
                }
                config.bundle.windows = {
                  certificateThumbprint: process.env.WINDOWS_CODESIGN_THUMBPRINT,
                  digestAlgorithm: "sha256",
                  timestampUrl: process.env.WINDOWS_TIMESTAMP_URL,
                  tsp: true,
                };
              }
              fs.writeFileSync(process.argv[1], JSON.stringify(config));
            ' "$config"
          else
            node -e '
              require("node:fs").writeFileSync(
                process.argv[1],
                JSON.stringify({ version: process.env.ROSYNC_DESKTOP_VERSION }),
              );
            ' "$config"
          fi
          build_args=(
            --target "${{ matrix.target }}"
            --ci
            --config "$config"
          )
          if [[ "$ROSYNC_TAGGED_RELEASE" != "1" ]]; then
            build_args+=(--no-sign)
          fi
          npm run build -- "${build_args[@]}"

      - name: Verify same-commit desktop, daemon, and plugin identities
        shell: bash
        run: |
          set -euo pipefail
          desktop_binary="desktop/src-tauri/target/${{ matrix.target }}/release/ro-sync-desktop"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            desktop_binary="${desktop_binary}.exe"
          fi
          test -x "$desktop_binary" || test -f "$desktop_binary"
          node scripts/verify-build-identity.mjs \
            --desktop "$desktop_binary" \
            --sidecar "daemon/${{ matrix.sidecar }}" \
            --plugin plugin/Plugin.rbxm \
            --plugin-manifest plugin/Plugin.build.json \
            --commit "$GITHUB_SHA" \
            --version "$ROSYNC_DESKTOP_VERSION"

      - name: Stage desktop release assets
        shell: bash
        env:
          RELEASE_ASSET_DIR: desktop/release-assets
          RELEASE_PLATFORM: ${{ matrix.asset_platform }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bundle_root="desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          rm -rf "$RELEASE_ASSET_DIR"
          mkdir -p "$RELEASE_ASSET_DIR"

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            installer="$(find "$bundle_root/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
            test -n "$installer"
            cp "$installer" "$RELEASE_ASSET_DIR/Ro-Sync-$ROSYNC_DESKTOP_VERSION-macos-arm64.dmg"
            if [[ "$ROSYNC_TAGGED_RELEASE" == "1" ]]; then
              updater="$(find "$bundle_root/macos" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)"
              test -n "$updater"
              test -f "$updater.sig"
              updater_asset="$RELEASE_ASSET_DIR/Ro-Sync-$ROSYNC_DESKTOP_VERSION-macos-arm64.app.tar.gz"
              cp "$updater" "$updater_asset"
              cp "$updater.sig" "$updater_asset.sig"
            fi
          else
            msi="$(find "$bundle_root/msi" -maxdepth 1 -type f -name '*.msi' -print -quit)"
            setup="$(find "$bundle_root/nsis" -maxdepth 1 -type f -name '*-setup.exe' -print -quit)"
            test -n "$msi"
            test -n "$setup"
            msi_asset="$RELEASE_ASSET_DIR/Ro-Sync-$ROSYNC_DESKTOP_VERSION-windows-x64.msi"
            setup_asset="$RELEASE_ASSET_DIR/Ro-Sync-$ROSYNC_DESKTOP_VERSION-windows-x64-setup.exe"
            cp "$msi" "$msi_asset"
            cp "$setup" "$setup_asset"
            if [[ "$ROSYNC_TAGGED_RELEASE" == "1" ]]; then
              test -f "$msi.sig"
              test -f "$setup.sig"
              cp "$msi.sig" "$msi_asset.sig"
              cp "$setup.sig" "$setup_asset.sig"
            fi
          fi

          node -e '
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            const path = require("node:path");
            const prepared = JSON.parse(fs.readFileSync("desktop/dist/prepare-manifest.json", "utf8"));
            if (prepared.target !== process.env.RELEASE_TARGET) {
              throw new Error(`prepared target mismatch: ${prepared.target}`);
            }
            const provenance = {
              schemaVersion: 1,
              commit: process.env.GITHUB_SHA,
              ref: process.env.GITHUB_REF,
              version: process.env.ROSYNC_DESKTOP_VERSION,
              platform: process.env.RELEASE_PLATFORM,
              prepared,
            };
            const directory = process.env.RELEASE_ASSET_DIR;
            const manifest = path.join(
              directory,
              `Ro-Sync-${process.env.ROSYNC_DESKTOP_VERSION}-${process.env.RELEASE_PLATFORM}.manifest.json`,
            );
            fs.writeFileSync(manifest, `${JSON.stringify(provenance, null, 2)}\n`);
            for (const name of fs.readdirSync(directory).sort()) {
              const file = path.join(directory, name);
              if (!fs.statSync(file).isFile() || name.endsWith(".sha256")) continue;
              const hash = crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
              fs.writeFileSync(`${file}.sha256`, `${hash}  ${name}\n`);
            }
          '

      - name: Verify final Windows installer Authenticode signatures
        if: runner.os == 'Windows' && env.ROSYNC_TAGGED_RELEASE == '1'
        shell: pwsh
        run: |
          $installers = @(
            "desktop/release-assets/Ro-Sync-$env:ROSYNC_DESKTOP_VERSION-windows-x64.msi",
            "desktop/release-assets/Ro-Sync-$env:ROSYNC_DESKTOP_VERSION-windows-x64-setup.exe"
          )
          foreach ($installer in $installers) {
            if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
              throw "final signed installer was not produced: $installer"
            }
            & $env:WINDOWS_SIGNTOOL verify /pa /all /tw $installer
            if ($LASTEXITCODE -ne 0) {
              throw "signtool verify failed for $installer"
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ro-sync-desktop-${{ matrix.asset_platform }}
          path: desktop/release-assets/*
          if-no-files-found: error

      - name: Remove imported Windows Authenticode certificate
        if: always() && runner.os == 'Windows' && env.ROSYNC_TAGGED_RELEASE == '1'
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_THUMBPRINT)) {
            $certificatePath = "Cert:\CurrentUser\My\$($env:WINDOWS_CODESIGN_THUMBPRINT)"
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }

  release:
    needs: [build, plugin, desktop]
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify release bundles
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          shopt -s nullglob
          standalone_daemons=(
            rosync-darwin-arm64
            rosync-linux-x86_64
            rosync-windows-x86_64.exe
          )
          for daemon in "${standalone_daemons[@]}"; do
            test -f "$daemon"
            test -f "$daemon.sha256"
            sha256sum --check --strict -- "$daemon.sha256"
          done
          bundles=(rosync-*-bundle.zip)
          test "${#bundles[@]}" -eq 3
          sha256sum --check --strict -- *-bundle.zip.sha256
          for bundle in "${bundles[@]}"; do
            unzip -tq "$bundle"
            unzip -Z1 "$bundle" | grep -Eq '^daemon/rosync-(darwin-arm64|linux-x86_64|windows-x86_64\.exe)$'
            unzip -Z1 "$bundle" | grep -Eq '^tools/luau/(darwin-arm64|linux-x86_64|windows-x86_64)/luau-compile(\.exe)?$'
            unzip -Z1 "$bundle" | grep -q '^tools/luau/LICENSE.txt$'
          done
          desktop_manifests=(Ro-Sync-*.manifest.json)
          desktop_checksums=(Ro-Sync-*.sha256)
          mac_installers=(Ro-Sync-*-macos-arm64.dmg)
          mac_updaters=(Ro-Sync-*-macos-arm64.app.tar.gz)
          mac_updater_signatures=(Ro-Sync-*-macos-arm64.app.tar.gz.sig)
          windows_msis=(Ro-Sync-*-windows-x64.msi)
          windows_setups=(Ro-Sync-*-windows-x64-setup.exe)
          windows_msi_updater_signatures=(Ro-Sync-*-windows-x64.msi.sig)
          windows_nsis_updater_signatures=(Ro-Sync-*-windows-x64-setup.exe.sig)
          test "${#desktop_manifests[@]}" -eq 2
          test "${#desktop_checksums[@]}" -eq 9
          test "${#mac_installers[@]}" -eq 1
          test "${#mac_updaters[@]}" -eq 1
          test "${#mac_updater_signatures[@]}" -eq 1
          test "${#windows_msis[@]}" -eq 1
          test "${#windows_setups[@]}" -eq 1
          test "${#windows_msi_updater_signatures[@]}" -eq 1
          test "${#windows_nsis_updater_signatures[@]}" -eq 1
          sha256sum --check --strict -- Ro-Sync-*.sha256
          for manifest in "${desktop_manifests[@]}"; do
            jq -e --arg commit "$GITHUB_SHA" '
              .schemaVersion == 1 and
              .commit == $commit and
              (.version | type == "string" and length > 0) and
              (.prepared.schemaVersion == 1) and
              (.prepared.sidecar.sha256 | test("^[a-f0-9]{64}$")) and
              .prepared.sidecar.version == .version and
              .prepared.sidecar.buildCommit == ($commit[0:12]) and
              .prepared.sidecar.buildDirty == false and
              (.prepared.plugin.sha256 | test("^[a-f0-9]{64}$")) and
              .prepared.plugin.buildCommit == ($commit[0:12]) and
              .prepared.plugin.buildDirty == false and
              (.prepared.frontend | length > 0) and
              (.prepared.resources | length > 0) and
              any(.prepared.resources[]; .path == "tools/luau-lsp/LICENSE.md")
            ' "$manifest"
          done
      - name: Create signed updater manifest
        shell: bash
        env:
          ROSYNC_UPDATER_PUBLIC_KEY: ${{ vars.ROSYNC_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mac_asset="Ro-Sync-$version-macos-arm64.app.tar.gz"
          windows_msi_asset="Ro-Sync-$version-windows-x64.msi"
          windows_nsis_asset="Ro-Sync-$version-windows-x64-setup.exe"
          node scripts/check-updater-key-pin.mjs verify
          node scripts/create-updater-manifest.mjs \
            --version "$version" \
            --tag "$GITHUB_REF_NAME" \
            --asset-dir artifacts \
            --mac-asset "$mac_asset" \
            --windows-msi-asset "$windows_msi_asset" \
            --windows-nsis-asset "$windows_nsis_asset" \
            --output artifacts/latest.json
          jq -e --arg version "$version" \
            '.version == $version and (.platforms | keys | sort) == ["darwin-aarch64-app", "windows-x86_64-msi", "windows-x86_64-nsis"]' \
            artifacts/latest.json
      - name: Resolve GitHub release policy
        id: release-policy
        env:
          ROSYNC_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import { updaterReleasePolicy } from "./scripts/create-updater-manifest.mjs";
            const tag = process.env.ROSYNC_RELEASE_TAG || "";
            if (!tag.startsWith("v")) throw new Error(`invalid release tag: ${tag}`);
            const policy = updaterReleasePolicy(tag.slice(1));
            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `prerelease=${policy.prerelease}\nmake_latest=${policy.makeLatest}\n`,
            );
          '
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ steps.release-policy.outputs.prerelease }}
          make_latest: ${{ steps.release-policy.outputs.make_latest }}
