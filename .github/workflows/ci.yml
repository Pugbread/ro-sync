name: ci

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  updater-smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop signing tools
        working-directory: desktop
        run: npm ci
      - name: Test updater trust and manifest pipeline with an ephemeral key
        run: node scripts/smoke-updater-release.mjs

  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust quality tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon -> target

      - name: Check Rust formatting
        working-directory: daemon
        run: cargo fmt --check

      - name: Check desktop Rust formatting
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check

      - name: Check Rust lints
        working-directory: daemon
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Check Luau formatting
        run: npx --yes @johnnymorganz/stylua-bin@2.5.2 --check plugin/Plugin.luau plugin/Clipboard.luau plugin/Playscript.luau plugin/Photo.luau plugin/RemoteControl.luau plugin-src/src/App.luau

      - name: Install pinned Luau compiler
        run: |
          set -euo pipefail
          compiler="$RUNNER_TEMP/luau-compile"
          node scripts/install-luau-compiler.mjs --verify-manifest
          node scripts/install-luau-compiler.mjs \
            --target linux-x86_64 \
            --dest "$compiler"
          test -x "$compiler"
          echo "LUAU_COMPILE=$compiler" >> "$GITHUB_ENV"

      - name: Install pinned luau-lsp
        env:
          LUAU_LSP_VERSION: "1.68.1"
          LUAU_LSP_UBUNTU_SHA256: "ddb5fe8fd503bbcb76ee439fbd6522efbfe9f0098be5a233401e493c579fc4a9"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/luau-lsp.zip"
          install_dir="$RUNNER_TEMP/luau-lsp"
          curl --fail --location --retry 3 \
            "https://github.com/JohnnyMorganz/luau-lsp/releases/download/$LUAU_LSP_VERSION/luau-lsp-linux-x86_64.zip" \
            --output "$archive"
          echo "$LUAU_LSP_UBUNTU_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          unzip -q "$archive" -d "$install_dir"
          analyzer="$(find "$install_dir" -type f -name luau-lsp -print -quit)"
          test -n "$analyzer"
          chmod +x "$analyzer"
          echo "ROSYNC_LUAU_LSP=$analyzer" >> "$GITHUB_ENV"

      - name: Compile Studio plugin Luau bytecode
        run: |
          node scripts/check-luau-bytecode.mjs plugin/Plugin.luau
          node scripts/check-luau-bytecode.mjs plugin/Clipboard.luau
          node scripts/check-luau-bytecode.mjs plugin/Playscript.luau
          node scripts/check-luau-bytecode.mjs plugin/Photo.luau
          node scripts/check-luau-bytecode.mjs plugin/RemoteControl.luau
          node scripts/check-luau-bytecode.mjs plugin-src/src/App.luau

      - name: Analyze native clipboard Luau
        run: >-
          "$ROSYNC_LUAU_LSP" analyze --platform roblox
          --definitions tools/luau-lsp/roblox/globalTypes.d.luau
          plugin/Clipboard.luau

      - name: Check strict DataModel lint parity
        working-directory: daemon
        shell: bash
        run: |
          set +e
          output="$(cargo run --quiet --locked -- lint \
            --project tests/fixtures/lint-parity \
            --path ReplicatedStorage/StrictDataModelError.luau \
            --data-model filesystem \
            --raw)"
          status=$?
          set -e
          test "$status" -ne 0
          jq -e '
            .ok == false and
            .dataModel.strict == true and
            .diagnosticCount >= 1 and
            any(.diagnostics[]; .category == "TypeError")
          ' <<<"$output"

          set +e
          output="$(cargo run --quiet --locked -- lint \
            --project tests/fixtures/lint-parity \
            --path StarterPlayer/PlayerModule/ExplicitVendorTarget.luau \
            --data-model filesystem \
            --raw)"
          status=$?
          set -e
          test "$status" -ne 0
          jq -e '
            .diagnosticCount >= 1 and
            any(.diagnostics[];
              .path == "StarterPlayer/PlayerModule/ExplicitVendorTarget.luau" and
              .category == "TypeError")
          ' <<<"$output"

          set +e
          output="$(cargo run --quiet --locked -- lint \
            --project tests/fixtures/lint-parity \
            --path ReplicatedStorage/RegisterLimit.luau \
            --data-model filesystem \
            --compile required \
            --raw)"
          status=$?
          set -e
          test "$status" -ne 0
          jq -e '
            .analyzerDiagnosticCount == 0 and
            .compiler.optimizationsChecked == [0, 1, 2] and
            .compilerDiagnosticCount >= 1 and
            any(.diagnostics[];
              .stage == "compiler" and
              .category == "CompileError" and
              (.message | contains("exceeded limit 200")))
          ' <<<"$output"

          cargo run --quiet --locked -- lint \
            --project tests/fixtures/lint-parity \
            --path ReplicatedStorage/Valid.luau \
            --data-model filesystem \
            --raw | jq -e '.ok == true and .diagnosticCount == 0'

      - name: Check widget JavaScript syntax
        run: |
          node --check app.js
          node --check bridge.js
          node --check lifecycle-policy.js
          node --check project-init.js
          node --check platform.js
          node --check scripts/install-luau-compiler.mjs
          for file in views/*.js; do node --check "$file"; done
          node scripts/check-host-adapter.mjs
          node scripts/check-lifecycle-policy.mjs
          node scripts/check-platform-commands.mjs
          node scripts/check-windows-release-policy.mjs
          node scripts/check-project-path-policy.mjs
          node scripts/check-project-init-policy.mjs
          node scripts/check-initial-selection.mjs
          node scripts/check-plugin-reconnect-policy.mjs
          node scripts/check-activity-format.mjs
          node scripts/check-theme-policy.mjs

      - name: Install plugin build tools
        run: |
          cargo install --locked --version 0.3.2 wally
          cargo install --locked --version 7.5.1 rojo

      - name: Check generated Studio plugin
        run: |
          node plugin/build-plugin.mjs
          git diff --exit-code -- plugin/Plugin.rbxm

      - name: Check generated command docs
        run: |
          node scripts/build-command-docs.mjs
          git diff --exit-code -- docs/client-commands.generated.json docs/client-commands.md

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check widget platform commands
        run: node scripts/check-platform-commands.mjs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon -> target

      - name: Test daemon
        working-directory: daemon
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Exercise Windows source build without optional tool downloads
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ROSYNC_SKIP_TOOL_DOWNLOAD: "1"
        run: ./daemon/build.ps1

  desktop:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            platform: darwin-arm64
            sidecar: rosync-darwin-arm64
            daemon_binary: rosync
            lsp_asset: luau-lsp-macos.zip
            lsp_binary: luau-lsp
            lsp_sha256: e32a71823ee47471d931a03e4186ced2b4c43bb785c8fe05de901fe54c6ebe21
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            sidecar: rosync-windows-x86_64.exe
            daemon_binary: rosync.exe
            lsp_asset: luau-lsp-win64.zip
            lsp_binary: luau-lsp.exe
            lsp_sha256: 15f2add7c70191c5cd636b047968760f0056893b63be10294453c75430bcb339

    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      LUAU_LSP_VERSION: "1.68.1"
      LUAU_LSP_LICENSE_SHA256: 5bf374ce7ab54c8d75f14e21f04932cae10708189afaec95321aed1a47701935
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            daemon -> target
            desktop/src-tauri -> target

      - name: Build same-commit daemon sidecar
        shell: bash
        run: |
          set -euo pipefail
          cargo build \
            --release \
            --locked \
            --manifest-path daemon/Cargo.toml \
            --target "${{ matrix.target }}"
          cp \
            "daemon/target/${{ matrix.target }}/release/${{ matrix.daemon_binary }}" \
            "daemon/${{ matrix.sidecar }}"
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            chmod +x "daemon/${{ matrix.sidecar }}"
          fi

      - name: Install checksum-pinned Luau compiler
        run: node scripts/install-luau-compiler.mjs --target ${{ matrix.platform }}

      - name: Install checksum-pinned luau-lsp
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/${{ matrix.lsp_asset }}"
          extract_dir="$RUNNER_TEMP/luau-lsp"
          destination="tools/luau-lsp/${{ matrix.platform }}/${{ matrix.lsp_binary }}"
          license="tools/luau-lsp/LICENSE.md"
          curl --fail --location --retry 3 \
            "https://github.com/JohnnyMorganz/luau-lsp/releases/download/$LUAU_LSP_VERSION/${{ matrix.lsp_asset }}" \
            --output "$archive"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/$LUAU_LSP_VERSION/LICENSE.md" \
            --output "$license"
          LSP_ARCHIVE="$archive" LSP_SHA256="${{ matrix.lsp_sha256 }}" \
            LSP_LICENSE="$license" node -e '
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            function verify(file, expected, label) {
              const actual = crypto.createHash("sha256")
                .update(fs.readFileSync(file)).digest("hex");
              if (actual !== expected) throw new Error(`${label} SHA-256 mismatch: ${actual}`);
            }
            verify(process.env.LSP_ARCHIVE, process.env.LSP_SHA256, "luau-lsp archive");
            verify(process.env.LSP_LICENSE, process.env.LUAU_LSP_LICENSE_SHA256, "luau-lsp license");
          '
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir" "$(dirname "$destination")"
          unzip -q "$archive" -d "$extract_dir"
          executable="$(find "$extract_dir" -type f -name '${{ matrix.lsp_binary }}' -print -quit)"
          test -n "$executable"
          cp "$executable" "$destination"
          if [[ "$RUNNER_OS" != "Windows" ]]; then chmod +x "$destination"; fi
          "$destination" --version | grep -F "$LUAU_LSP_VERSION"

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Prepare desktop native-host resources
        working-directory: desktop
        run: npm run sync

      - name: Test desktop native host
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Prepare and compile desktop application
        if: runner.os != 'Windows'
        working-directory: desktop
        run: npm run build -- --target ${{ matrix.target }} --no-bundle --ci --no-sign

      - name: Build unsigned Windows MSI and NSIS installers
        if: runner.os == 'Windows'
        working-directory: desktop
        run: npm run build -- --target ${{ matrix.target }} --bundles msi,nsis --ci --no-sign

      - name: Check unsigned Windows MSI and NSIS outputs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundleRoot = "desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          $msi = @(Get-ChildItem -LiteralPath "$bundleRoot/msi" -Filter '*.msi' -File)
          $nsis = @(Get-ChildItem -LiteralPath "$bundleRoot/nsis" -Filter '*-setup.exe' -File)
          if ($msi.Count -eq 0) { throw "unsigned MSI bundle was not produced" }
          if ($nsis.Count -eq 0) { throw "unsigned NSIS bundle was not produced" }
